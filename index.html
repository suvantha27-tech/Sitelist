    <title>Video and Smart Link Split View</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* ផ្នែកវីដេអូខាងលើ (ពាក់កណ្ដាលអេក្រង់) */
        .video-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* ផ្នែក Smart Link ខាងក្រោម (ពាក់កណ្ដាលអេក្រង់) */
        .smartlink-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- ផ្នែកវីដេអូខាងលើ -->
    <div class="video-section">
        <video id="player" controls autoplay muted playsinline></video>
    </div>

    <!-- ផ្នែក Smart Link ខាងក្រោម ដំណើរការក្នុងពេលជាមួយគ្នា -->
    <div class="smartlink-section">
        <iframe id="smartLinkFrame"></iframe>
    </div>

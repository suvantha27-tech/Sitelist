<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P8WT456TS4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-P8WT456TS4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Smart Link Split View</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        /* ផ្នែកវីដេអូខាងលើ (ពាក់កណ្ដាលអេក្រង់) */
        .video-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* ផ្នែក Smart Link ខាងក្រោម (ពាក់កណ្ដាលអេក្រង់) */
        .smartlink-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- ផ្នែកវីដេអូខាងលើ -->
    <div class="video-section">
        <video id="player" controls autoplay muted playsinline></video>
    </div>

    <!-- ផ្នែក Smart Link ខាងក្រោម ដំណើរការក្នុងពេលជាមួយគ្នា -->
    <div class="smartlink-section">
        <iframe id="smartLinkFrame"></iframe>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");
        const smartLinkFrame = document.getElementById("smartLinkFrame");
        const smartLink = "https://sauszhi.com/2133925";

        // កំណត់តំណរវីដេអូតាមរយៈ ?video= URL Parameter
        if (videoUrl) {
            player.src = videoUrl;
            player.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        } else {
            document.querySelector('.video-section').innerHTML = "<h2 style='color:white;text-align:center;'>No Video Found</h2>";
        }

        // ផ្ទុក Smart Link ឱ្យដើរក្នុង iframe ក្នុងពេលដំណាលគ្នា
        smartLinkFrame.src = smartLink;
    </script>
</body>
</html>

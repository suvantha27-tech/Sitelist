<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - Hybrid 2 in 1</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        /* វីដេអូលេងពេញអេក្រង់ */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* ប៊ូតុង Smart Link បែបកូនកាត់ (Floating Banner) នៅផ្នែកខាងក្រោម */
        .overlay-banner {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 45, 85, 0.95);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- វីដេអូបង្ហាញធម្មតាមាន controls ពេញលេញ -->
        <video id="player" controls playsinline></video>

        <!-- ប៊ូតុង Smart Link ចន្លោះកណ្តាលនិងក្រោម (Hybrid Solution) -->
        <a href="https://boring-active.com/7B6FQd" target="_blank" rel="noopener noreferrer" class="overlay-banner">
            ▶ ចុចទីនេះមើលវីដេអូពេញ 🔗
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get("video");
        const player = document.getElementById("player");

        if (videoUrl) {
            player.src = videoUrl;
        } else {
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40px;'>No Video Found</h2>";
        }
    </script>
</body>
</html>
